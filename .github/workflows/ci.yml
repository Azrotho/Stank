name: ci.yml
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: CMake
        run: mkdir build && cd build && cmake ..

      - name: Build
        run: cd build && make

